# Decision4 v1.0.1 starter: review selectors and recovery ownership for this repo.
# Schema: https://raw.githubusercontent.com/Habitat-Thinking/decision4/4429f821780655f253a954b2659bf38e7b9d5517/boundary-map.schema.json
version: 1
precedence: highest-floor-wins
entries:
  - select: {paths: ["**"]}
    floor: Undo
    put_right: "A revert restores the previous result; review this default before adoption"
  - select: {paths: ["boundary-map.yaml", "AGENTS.md", "CLAUDE.md", ".github/**"]}
    floor: Repair
    put_right: "The team restores the rules and fixes outputs already generated from them"
    answerer: "Repository maintainer"
