version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directories: [/, /.github/actions/*]
    schedule: { interval: weekly }
  # Bumps the digest-pinned node and Chainguard bases in the Dockerfile. The public latest tag
  # can change Node majors: check it against .nvmrc before accepting a digest.
  - package-ecosystem: docker
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 3
    groups:
      docker-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ["*"]
    # The build stage must match the Chainguard runtime's Node major (26, an approved LTS line);
    # a major move is a deliberate change of both FROM lines together.
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
